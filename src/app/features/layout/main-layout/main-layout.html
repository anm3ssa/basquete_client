<div class="estrutura">
  <!-- Desktop: sidebar fixa -->
  <app-sidebar class="lateral" />

  <!-- Celular: a mesma sidebar dentro de um drawer -->
  <p-drawer
    [(visible)]="menuAberto"
    position="left"
    [showCloseIcon]="false"
    styleClass="gaveta"
    ariaCloseLabel="Fechar menu"
  >
    <ng-template #headless>
      <app-sidebar (navegou)="menuAberto.set(false)" />
    </ng-template>
  </p-drawer>

  <div class="area">
    <app-header (abrirMenu)="menuAberto.set(true)" />

    <main class="conteudo">
      <router-outlet />
    </main>

    <app-footer />
  </div>
</div>

<p-toast position="top-right" />
